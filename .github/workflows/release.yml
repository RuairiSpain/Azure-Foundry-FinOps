name: release

# Push a tag such as v0.2.0 to release. Steps: CONTRIBUTING.md > Releasing.
#   1. verify  - the tag matches the package version, the changelog has notes, the checks pass
#   2. build   - sdist and wheel
#   3. publish - to PyPI (trusted publishing; one-time setup in CONTRIBUTING.md)
#   4. release - a GitHub release with the notes and the files attached
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foundry-finops/pyproject.toml
      - name: Check the tag and write the release notes
        id: info
        run: python .github/scripts/release_info.py "$GITHUB_REF_NAME" --notes-out release-notes.md | tee -a "$GITHUB_OUTPUT"
      - name: Refuse to release placeholder metadata
        run: "! grep -rn 'your-org' foundry-finops/pyproject.toml foundry-finops-cowork/plugin/appPackage/manifest.json"
      - name: Install
        run: pip install -e "foundry-finops[dev,pandas]" PyJWT cryptography
      - name: Lint and type-check
        run: |
          ruff check src tests examples
          mypy
        working-directory: foundry-finops
      - name: Test
        run: |
          (cd foundry-finops && pytest)
          PYTHONPATH=foundry-finops-cowork python -m pytest -q foundry-finops-cowork/tests
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
        working-directory: foundry-finops
      - run: twine check dist/*
        working-directory: foundry-finops
      - name: Check the built files carry the tagged version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ls dist
          for f in dist/*; do case "$f" in *"-$VERSION"[-.]*) ;; *) echo "::error::$f doesn't contain version $VERSION"; exit 1 ;; esac; done
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
        working-directory: foundry-finops
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: foundry-finops/dist/
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Needs a trusted publisher on PyPI for this repository, workflow release.yml and environment "pypi".
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing: no API token is stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: rm -f dist/SHA256SUMS.txt   # not a package file
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [verify, build, publish]
    # Only after PyPI accepted the files, so a GitHub release never exists without its package.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file release-notes.md "${flags[@]}"
