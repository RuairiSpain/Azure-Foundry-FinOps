name: ci

# Runs on every pull request and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catches a new release of the Microsoft packages that changes what we mirror

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # a newer push to the same PR supersedes the older run

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: foundry-finops/pyproject.toml
      - run: pip install ruff
      # Both projects use the rules in foundry-finops/pyproject.toml
      - run: ruff check src tests examples
        working-directory: foundry-finops
      - run: ruff check --config foundry-finops/pyproject.toml foundry-finops-cowork
      - name: Lint workflow files
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  sdk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: foundry-finops } }
    strategy:
      fail-fast: false
      matrix: { python: ["3.10", "3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: foundry-finops/pyproject.toml
      - run: pip install -e ".[dev,pandas,conformance]"
      - run: pytest --cov=foundry_finops
      - run: mypy

  mcp-server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.10", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: foundry-finops-cowork/mcp_server/requirements.txt
      - run: pip install -e foundry-finops pytest PyJWT cryptography
      - run: python -m pytest -q foundry-finops-cowork/tests
        env: { PYTHONPATH: foundry-finops-cowork }
